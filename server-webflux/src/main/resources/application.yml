server:
  port: 8080

spring:
  application:
    name: risu-tokenizer-service
  data:
    redis:
      host: localhost
      port: 6379
      # Fail fast when Redis is down so the L2 fallback (compute) kicks in
      # quickly instead of holding commands in the reconnect queue.
      connect-timeout: 500ms
      timeout: 500ms
  codec:
    max-in-memory-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}

risutoken:
  models-dir: ../models
  cache:
    l1-max-size: 10000
    l1-expire-after-write-minutes: 60
    l2-ttl-hours: 24
    l2-write-back-buffer-size: 2000
  tokenizer:
    cpu-threads: 8
    compute-queue-size: 2000
    compute-wait-timeout-seconds: 5
    max-text-length: 1000000
    max-batch-size: 1000
    batch-concurrency: 16

logging:
  level:
    com.risutoken: INFO
